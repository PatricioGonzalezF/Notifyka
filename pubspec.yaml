name: notify
description: "Notify - captura rapida de voz, transcripcion automatica y recordatorios."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Reconocimiento de voz -> texto
  speech_to_text: ^7.0.0

  # Grabacion y guardado de audio
  record: ^6.0.0
  path_provider: ^2.1.5
  audioplayers: ^6.1.0   # reproduccion del audio guardado (pantalla de detalle)

  # Persistencia local
  sqflite: ^2.4.1
  path: ^1.9.0

  # Notificaciones / recordatorios
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Formato de fechas
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
